name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-latest
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: bun ci
      - run: bun run check:version
      - run: bun run check:privacy
      - run: bun run test:scripts
      - run: bun run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check all target code
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings
      - name: Reject panicking production error handling
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib --bins ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: Test native target
        if: ${{ !matrix.target }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --tests
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: ${{ !matrix.target }}
        id: java8
        with:
          distribution: zulu
          java-version: '8'
          set-default: false
          cache-jdk: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: ${{ !matrix.target }}
        id: java17
        with:
          distribution: zulu
          java-version: '17'
          set-default: false
          cache-jdk: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: ${{ !matrix.target }}
        id: java21
        with:
          distribution: zulu
          java-version: '21'
          set-default: false
          cache-jdk: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: ${{ !matrix.target }}
        id: java25
        with:
          distribution: zulu
          java-version: '25'
          set-default: false
          cache-jdk: true
      - name: Verify JVM options and official Fabric predicate contracts
        if: ${{ !matrix.target }}
        env:
          HIKYOU_JAVA_8: ${{ steps.java8.outputs.path }}
          HIKYOU_JAVA_17: ${{ steps.java17.outputs.path }}
          HIKYOU_JAVA_21: ${{ steps.java21.outputs.path }}
          HIKYOU_JAVA_25: ${{ steps.java25.outputs.path }}
        run: node scripts/check-jvm-contract.mjs
      - name: Verify application packaging without publishing
        run: bun tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
