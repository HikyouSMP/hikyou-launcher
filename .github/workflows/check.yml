name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-latest
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: bun ci
      - run: bun run check:version
      - run: bun run check:privacy
      - run: bun run test:scripts
      - run: bun run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check all target code
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings
      - name: Test native target
        if: ${{ !matrix.target }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --tests
      - name: Verify application packaging without publishing
        run: bun tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
