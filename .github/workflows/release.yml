name: Release Tauri App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v26.1.0-beta.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

          # macOS Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

          # Linux
          - platform: ubuntu-22.04
            args: ""

          # Windows
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Linux only
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust build cache
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Frontend dependencies
      - name: Install frontend dependencies
        run: bun ci

      # A release tag must describe the exact Tauri/Cargo application version.
      - name: Verify release version
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          bun run check:version
          bun run check:release-version

      # Build Tauri app and publish GitHub Release
      - name: Build and Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Hikyou Launcher ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            This is a beta release.

            Please download the installer for your platform below.
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          tauriScript: bun tauri
          args: ${{ matrix.args }}
